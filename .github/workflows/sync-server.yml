name: Sync server

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify account isolation, conflicts, hierarchy, and media
        run: python3 -W error::ResourceWarning -m unittest discover -s server/tests -v
